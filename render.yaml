databases:
  - name: windward-crm-db
    plan: basic-256mb
    databaseName: windward_crm
    user: windward
    postgresMajorVersion: "16"

services:
  - type: web
    name: windward-api
    runtime: node
    plan: starter
    rootDir: packages/api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: windward-crm-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: contact@windwardfinancial.net
      - key: SCHEDULING_LINK
        value: https://windward.financial/schedule-an-appointment
      - key: QUO_API_KEY
        sync: false
      - key: QUO_WEBHOOK_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REBUILD_WEBHOOK_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_URL
        sync: false

  - type: web
    name: windward-web
    runtime: node
    plan: starter
    rootDir: packages/web
    buildCommand: npm install && npm run build
    startCommand: npx serve dist -s -l tcp://0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false

  - type: web
    name: windward-public
    runtime: node
    plan: starter
    rootDir: packages/public
    buildCommand: npm install && npm run build
    startCommand: npx serve dist -s -l tcp://0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://windward.financial
      - key: PUBLIC_NLG_LOGIN_URL
        sync: false
      - key: BUILD_DATABASE_URL
        fromDatabase:
          name: windward-crm-db
          property: connectionString
